<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08131d"><title>Varga Piano Neve</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><div><b>❄️ VARGA PIANO NEVE</b><small id="gps">GPS in attesa</small></div><button id="loc">◎</button></header><main><div id="map"></div><section id="panel"><div class="tabs"><button class="tab active" data-mode="major">🚜 Viabilità maggiore</button><button class="tab" data-mode="minor">👷 Viabilità minore</button></div><div id="major"><div class="status"><span>Servizio</span><b id="state">PRONTO</b></div><div class="metrics"><div><b id="km">0.00 km</b><small>lavorati</small></div><div><b id="accuracy">—</b><small>precisione GPS</small></div></div><p id="hint">Raggiungi il tratto assegnato e premi INIZIA.</p><div class="actions"><button id="start" class="go">▶ INIZIA</button><button id="pause" class="pause" disabled>⏸ PAUSA</button><button id="resume" class="go" hidden>▶ RIPRENDI</button><button id="return" hidden>↩ ULTIMO PUNTO</button><button id="stop" class="danger" disabled>■ TERMINA</button></div></div><div id="minor" hidden><div class="status"><span>Percorso operativo</span><b id="pointName">Caricamento percorso…</b></div><div class="actions"><button id="routePrev">← PERCORSO</button><button id="routeNext">PERCORSO →</button></div><p id="routeInfo">Le tappe vengono mostrate anche sulla mappa. Rosso = da fare, verde = completata.</p><div class="actions"><button id="navigate">🧭 NAVIGA</button><button id="minorStart" class="go">▶ INIZIA INTERVENTO</button><button id="minorDone">✓ COMPLETA</button><button id="next">➜ PROSSIMA TAPPA</button></div></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script
