name: Build offline major road network

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_major_network.py"
      - ".github/workflows/build-major-network.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_major_network.py"
      - ".github/workflows/build-major-network.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install --disable-pip-version-check requests shapely
      - name: Download Nord-Est and extract Castel Maggiore roads
        run: |
          curl -L --retry 4 --retry-delay 3 --fail             -o /tmp/nord-est.osm.pbf             https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf
          osmium extract -b 11.28,44.52,11.44,44.62 /tmp/nord-est.osm.pbf -o /tmp/castel.osm.pbf
          osmium tags-filter /tmp/castel.osm.pbf w/highway -o /tmp/roads.osm.pbf
          osmium export /tmp/roads.osm.pbf -f geojsonseq -o /tmp/roads.geojsonseq
      - name: Generate static network
        env:
          ROADS_GEOJSONSEQ: /tmp/roads.geojsonseq
        run: python scripts/build_major_network.py
      - name: Commit generated network
        run: |
          if git diff --quiet -- major-network.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add major-network.js
          git commit -m "Generate offline Castel Maggiore road network"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
