name: Build offline major road network

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_major_network.py"
      - ".github/workflows/build-major-network.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_major_network.py"
      - ".github/workflows/build-major-network.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - name: Generate static network
        run: python scripts/build_major_network.py
      - name: Commit generated network
        run: |
          if git diff --quiet -- major-network.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add major-network.js
          git commit -m "Generate offline Castel Maggiore road network"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
